<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>근무자 월 말 실적 데이터 입력</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .header {
      background: #111;
      color: #fff;
      padding: 18px 24px;
      font-size: 18px;
      font-weight: 700;
    }

    .wrap {
      max-width: 900px;
      margin: 38px auto;
      padding: 0 18px 50px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 34px;
      box-shadow: 0 8px 28px rgba(0,0,0,.07);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: -.7px;
    }

    .desc {
      margin: 0 0 28px;
      color: #666;
      font-size: 14px;
      line-height: 1.6;
    }

    .section {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid #eee;
    }

    .section:first-of-type {
      margin-top: 0;
      padding-top: 0;
      border-top: 0;
    }

    .section-title {
      margin-bottom: 18px;
      font-size: 16px;
      font-weight: 800;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      height: 48px;
      border: 1px solid #d7dbe0;
      border-radius: 10px;
      padding: 0 14px;
      font-size: 15px;
      outline: none;
      background: #fff;
    }

    input:focus,
    select:focus {
      border-color: #e60012;
      box-shadow: 0 0 0 3px rgba(230,0,18,.08);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 16px;
    }

    button {
      width: 100%;
      margin-top: 12px;
      border: 0;
      border-radius: 11px;
      padding: 15px 16px;
      background: #e60012;
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .status {
      display: none;
      margin-top: 14px;
      padding: 13px 14px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
    }

    .status.ok {
      display: block;
      background: #eef9f0;
      border: 1px solid #bee7c5;
      color: #166534;
    }

    .status.err {
      display: block;
      background: #fff1f1;
      border: 1px solid #f1c1c1;
      color: #991b1b;
    }

    .note {
      margin-top: 8px;
      font-size: 12px;
      color: #888;
    }

    /* 분석 결과 영역 */
    #reportResult {
      display: none;
      margin-top: 32px;
      background: #fff;
      border-radius: 18px;
      padding: 34px;
      box-shadow: 0 8px 28px rgba(0,0,0,.07);
      overflow-x: auto;
    }

    #reportResult.show {
      display: block;
    }

    @media (max-width: 620px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .card,
      #reportResult {
        padding: 24px 18px;
      }

      h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    KT 대리점 실적 입력
  </div>

  <main class="wrap">

    <div class="card">

      <h1>근무자 월 말 실적 데이터 입력</h1>

      <p class="desc">
        월 마감 실적 데이터를 입력한 뒤 제출해 주세요.
      </p>

      <form id="performanceForm">

        <div class="section">

          <div class="section-title">
            기본 정보
          </div>

          <div class="grid">

            <div class="field">

              <label for="store_id">
                매장 ID
              </label>

              <select
                id="store_id"
                name="store_id"
                required
              >
                <option value="">
                  선택하세요
                </option>

                <option value="DG001">
                  DG001
                </option>

                <option value="DG002">
                  DG002
                </option>

                <option value="DG003">
                  DG003
                </option>

              </select>

            </div>

            <div class="field">

              <label for="business_date">
                영업월
              </label>

              <input
                id="business_date"
                name="business_date"
                type="date"
                required
              />

              <div class="note">
                예: 2026-09-01
              </div>

            </div>

          </div>

          <div class="field">

            <label for="consults">
              상담건 수
            </label>

            <input
              id="consults"
              name="consults"
              type="number"
              min="0"
              required
            />

          </div>

        </div>


        <div class="section">

          <div class="section-title">
            단말 판매량
          </div>

          <div class="grid">

            <div class="field">

              <label for="galaxy_s26_sales">
                galaxy s26
              </label>

              <input
                id="galaxy_s26_sales"
                name="galaxy_s26_sales"
                type="number"
                min="0"
                required
              />

            </div>


            <div class="field">

              <label for="galaxy_s26_ultra_sales">
                galaxy s26 ultra
              </label>

              <input
                id="galaxy_s26_ultra_sales"
                name="galaxy_s26_ultra_sales"
                type="number"
                min="0"
                required
              />

            </div>


            <div class="field">

              <label for="iphone18_pro_sales">
                iphone18 pro
              </label>

              <input
                id="iphone18_pro_sales"
                name="iphone18_pro_sales"
                type="number"
                min="0"
                required
              />

            </div>


            <div class="field">

              <label for="flip8_sales">
                flip8
              </label>

              <input
                id="flip8_sales"
                name="flip8_sales"
                type="number"
                min="0"
                required
              />

            </div>

          </div>

        </div>


        <div class="section">

          <div class="section-title">
            프로모션
          </div>

          <div class="field">

            <label for="promotion_hq">
              프로모션_본사지정
            </label>

            <input
              id="promotion_hq"
              name="promotion_hq"
              type="text"
            />

          </div>


          <div class="field">

            <label for="promotion_store">
              프로모션_지점별
            </label>

            <input
              id="promotion_store"
              name="promotion_store"
              type="text"
            />

          </div>

        </div>


        <div class="section">

          <div class="section-title">
            미구매 사유
          </div>

          <div class="grid">

            <div class="field">

              <label for="no_purchase_price">
                미구매_가격
              </label>

              <input
                id="no_purchase_price"
                name="no_purchase_price"
                type="number"
                min="0"
                required
              />

            </div>


            <div class="field">

              <label for="no_purchase_benefit">
                미구매_혜택
              </label>

              <input
                id="no_purchase_benefit"
                name="no_purchase_benefit"
                type="number"
                min="0"
                required
              />

            </div>


            <div class="field">

              <label for="no_purchase_service">
                미구매_서비스
              </label>

              <input
                id="no_purchase_service"
                name="no_purchase_service"
                type="number"
                min="0"
                required
              />

            </div>

          </div>

        </div>


        <button
          id="submitBtn"
          type="submit"
        >
          분석하기
        </button>


        <div
          id="status"
          class="status"
        ></div>

      </form>

    </div>


    <!-- n8n에서 받은 최종 리포트가 표시되는 영역 -->
    <div id="reportResult"></div>

  </main>


  <script>

    const WEBHOOK_URL =
      "https://hddoy2021.app.n8n.cloud/webhook-test/e78885c1-a893-4dd0-9991-a4ec26ea63f2";


    const form =
      document.getElementById("performanceForm");

    const button =
      document.getElementById("submitBtn");

    const statusBox =
      document.getElementById("status");

    const reportResult =
      document.getElementById("reportResult");


    form.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        const data =
          Object.fromEntries(
            new FormData(form).entries()
          );


        [
          "consults",
          "galaxy_s26_sales",
          "galaxy_s26_ultra_sales",
          "iphone18_pro_sales",
          "flip8_sales",
          "no_purchase_price",
          "no_purchase_benefit",
          "no_purchase_service"
        ]
        .forEach((key) => {

          data[key] =
            Number(data[key] || 0);

        });


        button.disabled = true;

        button.textContent =
          "분석 중...";


        statusBox.style.display =
          "none";


        reportResult.classList.remove("show");

        reportResult.innerHTML = "";


        try {

          const response =
            await fetch(
              WEBHOOK_URL,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify(data)
              }
            );


          if (!response.ok) {

            throw new Error(
              "HTTP " +
              response.status
            );

          }


          /*
            n8n Respond to Webhook에서

            Respond With → Text

            Response Body →
            {{ $json.html }}

            로 설정하면
            여기서 HTML 전체를 받게 됨
          */

          const reportHtml =
            await response.text();


          reportResult.innerHTML =
            reportHtml;


          reportResult.classList.add(
            "show"
          );


          statusBox.className =
            "status ok";


          statusBox.textContent =
            "분석이 완료되었습니다.";


          statusBox.style.display =
            "block";


          /*
            결과 확인 후 입력값을 유지하고 싶으면
            form.reset()은 넣지 않는 게 좋음.
          */


          reportResult.scrollIntoView({
            behavior: "smooth",
            block: "start"
          });


        }
        catch (error) {

          console.error(error);


          statusBox.className =
            "status err";


          statusBox.textContent =
            "분석에 실패했습니다. n8n 워크플로우와 Webhook 설정을 확인해 주세요.";


          statusBox.style.display =
            "block";

        }
        finally {

          button.disabled = false;

          button.textContent =
            "분석하기";

        }

      }
    );

  </script>

</body>
</html>
